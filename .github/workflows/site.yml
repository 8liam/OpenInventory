name: site

# The landing site imports the real app UI from `src/`, so app changes must keep it building too.
on:
  pull_request:
    paths: ["site/**", "src/**", ".github/workflows/site.yml"]
  push:
    branches: [main]
    paths: ["site/**", "src/**", ".github/workflows/site.yml"]

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: site
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: site/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: site/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
