name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-latest, windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm exec vp build
      - run: pnpm desktop:bundle
      # The tag is the source of truth for the version the updater compares against.
      - name: Package and publish
        shell: bash
        run: pnpm exec electron-builder --publish always -c.extraMetadata.version="${GITHUB_REF_NAME#v}"
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
