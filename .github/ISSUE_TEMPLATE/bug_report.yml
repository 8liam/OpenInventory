name: Bug report
description: Something isn't working
labels: [bug]
body:
  - type: input
    id: version
    attributes:
      label: Version
      description: Shown on the Releases page, or the Docker image tag
    validations:
      required: true
  - type: dropdown
    id: install
    attributes:
      label: How are you running it?
      options: [Windows app, macOS app, Linux AppImage, Docker, From source]
    validations:
      required: true
  - type: textarea
    id: what
    attributes:
      label: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: Remove anything sensitive (never paste `session.json`).
      render: shell
