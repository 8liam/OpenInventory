allowBuilds:
  electron: true
  electron-winstaller: false
  esbuild: true
  protobufjs: false
catalog:
  vite: npm:@voidzero-dev/vite-plus-core@1.1.0
  vite-plus: 1.1.0
overrides:
  # steam-appticket 1.x ships protobufjs 6-generated code; 6.x has no patched release.
  "steam-appticket@1>protobufjs": 7.6.6
  vite@*: "catalog:"
peerDependencyRules:
  allowAny:
    - vite
  allowedVersions:
    vite: "*"
